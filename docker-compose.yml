name: summariser

services:
  summariser:
    build: .
    image: summariser:local
    ports:
      - "127.0.0.1:8011:8000"
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 1200m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
